*{box-sizing:border-box;margin:0;padding:0}html{font-size:1.6vh}
body{height:100vh;overflow:hidden;background:var(--cream);color:var(--wine);font:600 1rem/1.4 'Cormorant Garamond',Georgia,serif;cursor:none}
#app{display:flex;height:100vh;background:radial-gradient(40% 30% at 80% 20%,rgba(246,188,172,.35),transparent),radial-gradient(40% 35% at 90% 90%,rgba(246,188,172,.3),transparent),var(--cream)}
#gw{position:relative;flex:none;height:100vh;width:100vh;overflow:hidden}
#g{display:grid;grid:repeat(5,1fr)/repeat(5,1fr);height:100%}
.t{position:relative;overflow:hidden}
.l{position:absolute;inset:0;background:center 35%/cover no-repeat;opacity:0;transform:scale(1.08);transition:opacity 1.8s ease,transform 7s ease-out}.l.on{opacity:1;transform:none}
#nm{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
#nm:before{content:"";position:absolute;width:92%;height:40%;background:radial-gradient(ellipse at center,rgba(253,240,230,.95) 0,rgba(253,240,230,.88) 46%,rgba(253,240,230,0) 72%)}
#nm>*{position:relative}
.n{font-family:'Pinyon Script',cursive;font-weight:400;font-size:6.6rem;line-height:1.1;-webkit-text-stroke:.03rem currentColor}
.w{letter-spacing:.5em;padding-left:.5em;font-size:2rem;text-transform:uppercase;font-weight:700}
.hd{width:60%;aspect-ratio:426/51;background:var(--hd) center/contain no-repeat;margin:.6rem auto}
#nm .hd{width:22rem;margin:.2rem auto}
#sp{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .9s;pointer-events:none;background:rgba(253,240,230,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#sp.on{opacity:1}
#spi{width:72%;aspect-ratio:1;background:#fdf1e8 center/contain no-repeat;border:.6rem solid #fdf1e8;border-radius:.5rem;box-shadow:0 2rem 5rem rgba(60,15,30,.4);transform:scale(.86) rotate(-1.5deg);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
#sp.on #spi{transform:none}
#pn{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fl{position:absolute;pointer-events:none;background:no-repeat center/contain}
.tl{left:-2vh;top:-2vh;width:34vh;aspect-ratio:364/386;background-image:var(--cL)}
.br{right:-2vh;bottom:-2vh;width:34vh;aspect-ratio:370/387;background-image:var(--cR);transform:scaleY(-1)}
.bf{left:6vh;bottom:9vh;width:12vh;aspect-ratio:208/192;background-image:var(--bf);animation:fly 8s ease-in-out infinite}
@keyframes fly{50%{transform:translate(1vh,-1.6vh) rotate(4deg)}}
.card{position:relative;z-index:2;width:56vh;padding:.6rem 1rem 1.4rem;text-align:center;border:2.4rem solid transparent;border-image-source:var(--fr);border-image-slice:56 fill;border-image-width:2.4rem}
.cap{letter-spacing:.2em;padding-left:.2em;text-transform:uppercase;font-weight:700;font-size:1.6rem}
#qr{width:78%;display:block;margin:.8rem auto;background:#fff;padding:.7rem;border-radius:.7rem;image-rendering:pixelated;box-shadow:0 .5rem 1.4rem rgba(122,16,52,.15)}
.s{font-size:1.3rem;margin-top:.3rem}#lnk{font-size:1rem;opacity:.85;word-break:break-all;margin-top:.3rem}
#msg{position:absolute;z-index:9;left:2rem;bottom:2rem;background:#fff;padding:.6rem 1rem;border-radius:.5rem;display:none}
</style></head><body>
<div id="app"><div id="gw"><div id="g"></div>
<div id="nm"><div class="n">Ar John &amp; Abigaile</div><div class="hd"></div><div class="w">Wedding</div></div>
<div id="sp"><div id="spi"></div></div></div>
<div id="pn"><div class="fl tl"></div><div class="fl br"></div><div class="fl bf"></div>
<div class="card"><div class="cap">Share your photos</div><div class="hd"></div><img id="qr" alt="QR code"><div class="s">Scan the code, upload your photos, and watch them appear on the screen!</div><div id="lnk"></div></div></div></div>
<div id="msg">Not connected yet: add the Google Drive link in this file. Add ?demo to the address to preview.</div>
<script>
var API="https://script.google.com/macros/s/AKfycbycVfWc0qHqLCFzKEupZQ-9pA1rFnBmrtX6KsNjCgJp9jUb_zJMqvwQI_zVI5W_zqRhnA/exec";
(function(){
var P=new URLSearchParams(location.search),DEMO=P.has("demo"),$=function(s){return document.querySelector(s)};
var g=$("#g"),sp=$("#sp"),spi=$("#spi"),tiles=[],seen={},q=[],busy=false,first=true,all=[],last=Date.now();
var C=["#f2d7d2","#f9efe5","#e9c4bf","#a9c1d4","#c8d0bc","#e8c98f","#d9a0a8"];
function rnd(n){return Math.floor(Math.random()*n)}
function floral(t){t.el.style.background="var(--c"+(rnd(2)?"L":"R")+") "+rnd(100)+"% "+rnd(100)+"%/"+(240+rnd(120))+"% no-repeat,linear-gradient("+rnd(360)+"deg,"+C[rnd(7)]+","+C[rnd(7)]+")"}
for(var i=0;i<25;i++){var e=document.createElement("div");e.className="t";e.innerHTML='<div class="l"></div><div class="l"></div>';g.appendChild(e);var t={el:e,l:e.children,i:0,id:null,t:0};floral(t);tiles.push(t)}
var demoFiles=[],dn=0,dc={};
function demoImg(id){if(dc[id])return dc[id];var c=document.createElement("canvas");c.width=c.height=500;var x=c.getContext("2d"),h=(parseInt(id.slice(1))*47)%360,gr=x.createLinearGradient(0,0,500,500);gr.addColorStop(0,"hsl("+h+",60%,70%)");gr.addColorStop(1,"hsl("+(h+50)+",55%,45%)");x.fillStyle=gr;x.fillRect(0,0,500,500);x.fillStyle="rgba(255,255,255,.35)";x.beginPath();x.arc(250,210,110,0,7);x.fill();x.fillRect(110,340,280,160);x.fillStyle="#fff";x.font="600 60px serif";x.textAlign="center";x.fillText("Photo "+id.slice(1),250,450);return dc[id]=c.toDataURL("image/jpeg",.8)}
function demoAdd(){demoFiles.unshift({id:"d"+(++dn),t:Date.now()})}
if(DEMO){for(var k=0;k<8;k++)demoAdd();setInterval(demoAdd,4500)}
function url(id,w){return DEMO?demoImg(id):"https://drive.google.com/thumbnail?id="+id+"&sz=w"+w}
function load(u){return new Promise(function(r){var m=new Image();m.onload=m.onerror=function(){r()};m.src=u;setTimeout(r,12000)})}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function put(t,id){var u=url(id,700);return load(u).then(function(){var n=t.l[t.i^1],o=t.l[t.i];n.style.backgroundImage='url("'+u+'")';n.classList.add("on");o.classList.remove("on");t.i^=1;t.id=id;t.t=Date.now()})}
function clear(t){t.l[0].classList.remove("on");t.l[1].classList.remove("on");t.id=null;floral(t)}
function target(){var e=tiles.filter(function(t){return!t.id});if(e.length)return e[rnd(e.length)];return tiles.reduce(function(a,b){return b.t<a.t?b:a})}
function run(){if(busy)return;busy=true;(function next(){var f=q.shift();if(!f){busy=false;return}
var t=target(),big=q.length<4,p=Promise.resolve();
if(big)p=load(url(f.id,1400)).then(function(){spi.style.backgroundImage='url("'+url(f.id,1400)+'")';sp.classList.add("on");return sleep(3800)}).then(function(){sp.classList.remove("on");return sleep(900)});
p.then(function(){return put(t,f.id)}).then(function(){return sleep(big?1200:500)}).then(next)})()}
function apply(files){all=files;var ids={};files.forEach(function(f){ids[f.id]=1});
tiles.forEach(function(t){if(t.id&&!ids[t.id]){var o=files.filter(function(f){return!tiles.some(function(x){return x.id==f.id})});if(o.length)put(t,o[rnd(o.length)].id);else clear(t)}});
if(first){first=false;files.forEach(function(f){seen[f.id]=1});var ord=tiles.slice().sort(function(){return Math.random()-.5});files.slice(0,25).forEach(function(f,k){setTimeout(function(){put(ord[k],f.id)},k*180)});return}
var nw=files.filter(function(f){return!seen[f.id]}).reverse();nw.forEach(function(f){seen[f.id]=1;q.push(f)});if(nw.length){last=Date.now();run()}}
function idle(){if(busy||first||Date.now()-last<30000)return;var o=all.filter(function(f){return!tiles.some(function(x){return x.id==f.id})});if(!o.length)return;var t=tiles.filter(function(x){return x.id}).reduce(function(a,b){return!a||b.t<a.t?b:a},null);if(t)put(t,o[rnd(o.length)].id)}
setInterval(idle,6000);
function poll(){var p=DEMO?Promise.resolve({files:demoFiles.slice()}):fetch(API+"?_="+Date.now()).then(function(r){return r.json()});p.then(function(j){if(j&&j.files)apply(j.files)}).catch(function(){})}
if(API||DEMO){poll();setInterval(poll,3000)}else $("#msg").style.display="block";
var u=new URL("upload.html",location.href).href;$("#lnk").textContent=u.replace(/^https?:\/\//,"");
try{var qr=qrcode(0,"M");qr.addData(u);qr.make();$("#qr").src=qr.createDataURL(12,0)}catch(e){$("#qr").style.display="none"}
function wl(){try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(function(){})}catch(e){}}wl();
document.addEventListener("visibilitychange",function(){if(!document.hidden)wl()});
document.addEventListener("keydown",function(e){if(e.key=="f"||e.key=="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
})();
